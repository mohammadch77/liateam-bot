# /etc/nginx/sites-available/liateam-shop-staging — staging behind a password (client preview, not indexed).
#   sudo htpasswd -c /etc/nginx/liateam-shop-staging.htpasswd client
#   sudo ln -s /etc/nginx/sites-available/liateam-shop-staging /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx      (reload, never restart: the other site stays up)
#   sudo certbot --nginx -d staging.example.com
server {
    listen 80;
    server_name staging.example.com;

    auth_basic "Staging";
    auth_basic_user_file /etc/nginx/liateam-shop-staging.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /health {
        auth_basic off;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3850;
    }

    location / {
        proxy_pass http://127.0.0.1:3850;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
