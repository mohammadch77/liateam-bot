# Avina shop — staging (template). One new file in sites-available; touches no other server block.
# Parameters (replaced with sed, README «نصب روی سرور اشتراکی»):
#   __DOMAIN__   the staging host name, e.g. staging.example.com
#   __NAME__     a short name for this site's own files, e.g. avina-staging
# Files this site uses, all new and its own:
#   /etc/nginx/__NAME__.htpasswd          Basic Auth users (htpasswd)
#   /var/www/__NAME__-acme                webroot for Let's Encrypt (certbot certonly --webroot)
#   /etc/letsencrypt/live/__DOMAIN__/     the certificate (made by certbot; this file never asks certbot to edit it)
# Written for nginx 1.24 (Ubuntu 24.04): `listen … ssl http2`. No http-level directive (no proxy_cache_path, no
# map, no upstream), so nothing outside this server block changes. Images are cached by the shop itself
# (.next/cache/images, 7 days) and the Cache-Control headers it sends are passed through.
#
# First install: only the port-80 part (between BEGIN-HTTP and END-HTTP) is enabled, so certbot can answer the
# challenge before a certificate exists; then the whole file. See the README.

# BEGIN-HTTP
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt (webroot): no password, nothing else served over http
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/__NAME__-acme;
        auth_basic off;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
# END-HTTP

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:__NAME___ssl:5m;
    ssl_session_timeout 1d;

    # staging is private: password, and never indexed
    auth_basic "Staging";
    auth_basic_user_file /etc/nginx/__NAME__.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 2m;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # staging: every crawler is told to stay out (also without the password)
    location = /robots.txt {
        auth_basic off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # health check only from the machine itself
    location = /health {
        auth_basic off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3861;
    }

    # hashed file names: cache for a year (Next sends the same header; keep it)
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3861;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # optimised images: the shop caches them for 7 days and says so in Cache-Control; nginx passes it through
    location ^~ /_next/image {
        proxy_pass http://127.0.0.1:3861;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3861;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
