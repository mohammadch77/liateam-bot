# Temporary access by IP until a domain exists: https://SERVER_IP:8443
# Separate file + separate port: does not touch other sites on this nginx (e.g. getStock).
#   sudo mkdir -p /etc/nginx/ssl
#   sudo openssl req -x509 -nodes -newkey rsa:2048 -days 825 \
#     -keyout /etc/nginx/ssl/liateam-dash.key -out /etc/nginx/ssl/liateam-dash.crt \
#     -subj "/CN=liateam-dashboard" -addext "subjectAltName=IP:SERVER_IP"
#   sudo cp nginx-ip-selfsigned.conf /etc/nginx/sites-available/liateam-dashboard-ip
#   sudo ln -s /etc/nginx/sites-available/liateam-dashboard-ip /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx      # reload only if -t says OK
# The browser warns once about the self-signed certificate; that is expected.
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/liateam-dash.crt;
    ssl_certificate_key /etc/nginx/ssl/liateam-dash.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Optional: only your own IP(s) may open the panel.
    # allow 1.2.3.4;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:3847;
        proxy_http_version 1.1;
        # $http_host keeps ":8443"; with $host Next.js rejects the login form (origin mismatch, CSRF check).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
