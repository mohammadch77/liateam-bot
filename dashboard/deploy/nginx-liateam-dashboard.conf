# /etc/nginx/sites-available/liateam-dashboard  (then: ln -s ... sites-enabled/ && nginx -t && systemctl reload nginx)
# TLS certificate: certbot --nginx -d dash.example.com
server {
    listen 443 ssl http2;
    server_name dash.example.com;
    # ssl_certificate / ssl_certificate_key are added by certbot

    location / {
        proxy_pass http://127.0.0.1:3847;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;          # used by the login rate limit
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
server {
    listen 80;
    server_name dash.example.com;
    return 301 https://$host$request_uri;
}
